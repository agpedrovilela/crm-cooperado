<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM do Cooperado</title>
<meta name="theme-color" content="#3B7A36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM Coop">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="shim.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="vendor/jspdf.umd.min.js" defer></script>
<style>
/* Layout: ferramenta do consultor. Painéis com números grandes no topo, listas de ação abaixo; ficha do produtor em páginas. */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --sunk:#E7ECE6; --ink:#16211C; --muted:#4D5C55; --line:#D5DDD6;
  --accent:#2747C4; --accent-ink:#FFFFFF; --maize:#A86D06; --leaf:#3B7A36; --leaf-ink:#FFFFFF;
  --crit:#BE3328; --warn:#A8690E; --ok:#2C7A4B; --gift:#8237B0;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#16201B; --sunk:#1E2924; --ink:#E4EBE7; --muted:#9AA9A2; --line:#2B3732;
  --accent:#8EA4FF; --accent-ink:#0B1230; --maize:#E5B04F; --leaf:#86C27A; --leaf-ink:#0E1A0C;
  --crit:#F2766C; --warn:#E8B45C; --ok:#72C595; --gift:#CDA0F0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201B; --sunk:#1E2924; --ink:#E4EBE7; --muted:#9AA9A2; --line:#2B3732;
  --accent:#8EA4FF; --accent-ink:#0B1230; --maize:#E5B04F; --leaf:#86C27A; --leaf-ink:#0E1A0C;
  --crit:#F2766C; --warn:#E8B45C; --ok:#72C595; --gift:#CDA0F0; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.55rem;font-weight:800}
h2{font-size:1.08rem;font-weight:700}
h3{font-size:.96rem;font-weight:700}
h1 svg,h2 svg,h3 svg{vertical-align:-3px;margin-right:6px;color:var(--muted)}
p{margin:0}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.sm{font-size:.86rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px 0}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:inherit}
.mark{width:30px;height:30px;border-radius:8px;background:var(--leaf);display:grid;place-items:center;color:var(--leaf-ink)}
.brand b{font-family:var(--f-display);font-size:1.05rem;font-weight:800;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.net{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.top-in{min-width:0}
@media (max-width:560px){.brand small,.gear .gt{display:none}.net{max-width:58vw;flex:none}.brand{min-width:0}.brand>span:last-child{min-width:0}.brand b{font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gear{flex:none;padding-inline:4px}}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.net.warn i{background:var(--warn)} .net.crit i{background:var(--crit)} .net.opp i{background:var(--accent)}
.net.warn,.net.crit{color:var(--ink)}
.thumbs .pend{aspect-ratio:4/3;border:1px dashed var(--warn);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:.74rem;color:var(--warn);padding:6px}
.gear{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.88rem;padding:6px 8px;border-radius:8px}
.gear[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{display:flex;align-items:center;gap:6px;padding:10px 11px;border-bottom:3px solid transparent;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.tabs a svg{opacity:.8}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--leaf)}

select,input[type=text],input[type=date],input[type=time],input[type=search],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%;width:100%}
input[type=color]{width:48px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}
textarea{resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.leaf{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:default}

main{padding-block:20px 72px}
.notice{padding:12px 14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h p{color:var(--muted);font-size:.86rem}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:880px){.grid2,.grid2e{grid-template-columns:1fr}}

.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
a.tile:hover{border-color:var(--accent)}
.tile .v{font-family:var(--f-display);font-size:1.6rem;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.tile .l{font-size:.84rem;color:var(--muted)}
.tile .x{font-size:.8rem;color:var(--muted);margin-top:2px}
.tile.crit .v{color:var(--crit)} .tile.warn .v{color:var(--warn)} .tile.leaf .v{color:var(--leaf)} .tile.opp .v{color:var(--accent)} .tile.ok .v{color:var(--ok)} .tile.gift .v{color:var(--gift)}
.meter{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.ok i{background:var(--ok)} .meter.leaf i{background:var(--leaf)}

.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.box-h p{color:var(--muted);font-size:.84rem;flex-basis:100%}
.box-h a{font-size:.86rem;font-weight:600}
.box-e{padding:14px;color:var(--muted)}
.box-b{padding:14px}
.list,.lst{display:flex;flex-direction:column}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>*+*,.lst>*+*{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;align-items:center}
.row .who{min-width:0;color:inherit;text-decoration:none;display:block}
.row .who:hover .nm{color:var(--accent)}
.row .nm{font-weight:700}
.row .nm small{font-weight:400;color:var(--muted)}
.row .sub{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
@media (max-width:560px){.row{grid-template-columns:1fr}.row .acts{justify-content:flex-start}}
.group-h{padding:7px 14px;background:var(--sunk);font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.group-h.crit{color:var(--crit)}

.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip b{font-weight:800}
.chip.crit{color:var(--crit);background:color-mix(in srgb,var(--crit) 13%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
.chip.gift{color:var(--gift);background:color-mix(in srgb,var(--gift) 13%,transparent)}
.chip.opp{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip.leaf{color:var(--leaf);background:color-mix(in srgb,var(--leaf) 14%,transparent)}
.chip.cult{color:var(--ink);background:color-mix(in srgb,var(--leaf) 14%,transparent)}
.chip.cult b{color:var(--leaf)}
.chip.ex{border:1px dashed var(--muted);background:transparent}
.g-proteger{--g:var(--ok)} .g-conquistar{--g:var(--accent)} .g-fidelizar{--g:var(--leaf)} .g-desenvolver{--g:var(--warn)} .g-null{--g:var(--muted)}
.chip.grp{color:var(--g);background:color-mix(in srgb,var(--g) 13%,transparent)}
.abc{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-family:var(--f-display);font-weight:800;font-size:.78rem;background:var(--sunk);color:var(--ink)}
.abc.A{background:var(--ink);color:var(--surface)}

/* DAP e estádio */
.dap{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:66px;padding:6px 8px;border-radius:10px;background:var(--leaf);color:var(--leaf-ink);line-height:1;text-align:center;flex:none}
.dap b{font-family:var(--f-display);font-size:1.55rem;font-weight:800}
.dap small{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.dap.pre{background:var(--sunk);color:var(--ink)}
.dap.none{background:var(--sunk);color:var(--muted)}
.dap.none b{font-size:.9rem}
.dap.est{background:var(--maize);color:var(--surface);max-width:150px}
.dap.est b{font-size:1rem;line-height:1.15}
.dap.est.exp{background:transparent;color:var(--maize);border:2px solid var(--maize)}
.dap.lg{min-width:110px;padding:12px 14px;border-radius:14px}
.dap.lg b{font-size:2.7rem}
.dap.lg.est b{font-size:1.35rem}
.dap.lg small{font-size:.72rem}
.lavline{display:flex;gap:12px;align-items:center;padding:12px 14px;min-width:0}
.lavline .info{min-width:0;flex:1}
.lavline .nm{font-weight:700}
.lavline .ph{font-family:var(--f-display);font-weight:700}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input[type=search]{flex:1 1 240px;width:auto}
.filters select{width:auto}
.filters label{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
.seg-tabs{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;margin-bottom:16px;max-width:100%;overflow-x:auto}
.seg-tabs a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;font-size:.92rem}
.seg-tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 15%,transparent)}

/* agenda */
.ag{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:4px 12px;padding:10px 14px;align-items:center}
.ag .d{font-family:var(--f-display);text-align:center;line-height:1.05}
.ag .d b{display:block;font-size:1.25rem}
.ag .d small{font-size:.7rem;color:var(--muted);text-transform:uppercase}
.ag.late .d b{color:var(--crit)}
.ag .t{font-weight:700}
.ag .s{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.ag .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.ag{grid-template-columns:46px minmax(0,1fr)}.ag .acts{grid-column:2;justify-content:flex-start}}
.ico{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px;flex:none}
.ico.visita{background:var(--accent)} .ico.operacao{background:var(--maize)} .ico.aplicacao{background:var(--leaf)} .ico.contato{background:var(--gift)} .ico.relatorio{background:var(--ink);border-radius:2px}

/* produtor */
.p-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.back{font-size:.88rem;text-decoration:none;font-weight:600}
.subtabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:4px 0 18px}
.subtabs a{padding:9px 12px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.subtabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--leaf)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 18px}
.kv div{min-width:0}
.kv span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kv b{font-weight:600;overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;font-size:.88rem;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tbody tr:last-child td{border-bottom:0}
th{background:var(--sunk);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0}
tr.cur td{background:color-mix(in srgb,var(--leaf) 10%,transparent)}
.areabar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:4px 0 6px;background:var(--sunk)}
.areabar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.lav{display:flex;flex-direction:column;gap:10px}
.lav-top{display:flex;gap:12px;align-items:flex-start}
.lav-top .info{min-width:0;flex:1}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf)}

/* linha do tempo */
.tl-wrap{overflow-x:auto;padding-bottom:4px}
.tl{position:relative;min-width:680px;padding:34px 0 8px}
.tl .bar{display:flex;height:36px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.tl .seg{border-right:1px solid var(--surface);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:600;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 3px}
.tl .seg:nth-child(odd){background:color-mix(in srgb,var(--leaf) 22%,var(--surface))}
.tl .seg:nth-child(even){background:color-mix(in srgb,var(--leaf) 10%,var(--surface))}
.tl .seg.jan{box-shadow:inset 0 -4px 0 var(--maize)}
.tl .seg.cur{background:var(--leaf);color:var(--leaf-ink)}
.tl .now{position:absolute;top:22px;bottom:0;width:2px;background:var(--crit)}
.tl .now::before{content:"hoje";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.68rem;font-weight:700;color:var(--crit)}
.tl .mk{position:absolute;top:8px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--surface)}
.tl .mk.aplicacao{background:var(--leaf)} .tl .mk.operacao{background:var(--maize)} .tl .mk.visita{background:var(--accent)} .tl .mk.relatorio{background:var(--ink);border-radius:2px} .tl .mk.feito{opacity:.45}
.tl .axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px}
.now-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.now-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 18px}
@media (max-width:520px){.now-box{grid-template-columns:1fr}}

/* recomendação */
.rec{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rec .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.rec .ttl{font-family:var(--f-display);font-weight:700}
.rec ol{margin:2px 0;padding-left:20px}
.rec li{margin:3px 0}
.rec li .dose{font-weight:700}
.rec li .q{color:var(--muted);font-size:.84rem}
.rec .meta{font-size:.84rem;color:var(--muted)}
.rec .tot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:8px;font-weight:700}
.rec.aplicada{opacity:.82}

/* painel de formulário */
.backdrop{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:41;overflow-y:auto;border-left:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) 18px}
.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.form label,.fl{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.form .full{grid-column:1/-1}
.hint{font-weight:400;font-size:.78rem;color:var(--muted)}
.form .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.form h3{grid-column:1/-1;margin-top:8px;color:var(--ink)}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.items{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,.7fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.item .calc{grid-column:1/-1;font-size:.82rem;color:var(--muted);margin-top:-2px}
.item .calc.err{color:var(--warn)}

function cultKey(s){const n=norm(s);if(!n)return null;const C=CAL();

  for(const k in C){const al=[norm(C[k].nome),...(C[k].alias||[]).map(norm)].filter(Boolean);if(al.some(a=>n.includes(a)))return k}

function cropDef(l){
  const k=cultKey(l.cultura);const base=k?CAL()[k]:null;if(!base||!Array.isArray(base.fases)||!base.fases.length)return null;
  const d={...base,key:k,custom:Array.isArray(l.fases)&&l.fases.length>0};
  if(base.tipo==='anual'){
    const cb=+base.ciclo||120,cl=+l.ciclo||cb;d.ciclo=cl;
    if(d.custom)d.fases=l.fases;else if(cl!==cb)d.fases=base.fases.map(f=>({...f,d:Math.round(f.d*cl/cb)}));
    d.fases=[...d.fases].map(f=>({...f,d:+f.d||0})).sort((a,b)=>a.d-b.d);
  }else{
    const ini=+base.inicioMes||0;d.inicioMes=ini;
    d.fases=[...(d.custom?l.fases:base.fases)].map(f=>({...f,m:+f.m||0})).sort((a,b)=>ordM(a.m,ini)-ordM(b.m,ini));
  }

}

function janelaLav(l){const def=cropDef(l);if(!def)return null;

/* ================= comercial ================= */
function potCalc(p){const c=CFG();let s=0;lavouras(p).forEach(l=>{const k=cultKey(l.cultura);if(!k)return;s+=(+l.area_ha||0)*(+c.custo_ha[k]||0);if(+l.vacas)s+=+l.vacas*(+c.custo_vaca||0)});return s}
function potInfo(p){const calc=potCalc(p),man=+p.potencial_anual||0;
  if(p.potencial_modo==='manual'&&man)return {v:man,fonte:'manual',calc};
  if(calc>0)return {v:calc,fonte:'calculado',calc,man};
  if(man)return {v:man,fonte:'informado',calc};
  return {v:0,fonte:null,calc}}
function K(){
  if(S._k)return S._k;
  const ps=[...S.prods.values()],c=CFG();
  const pots=ps.map(p=>potInfo(p).v).filter(v=>v>0).sort((a,b)=>a-b);
  const med=pots.length?(pots.length%2?pots[(pots.length-1)/2]:(pots[pots.length/2-1]+pots[pots.length/2])/2):0;
  const limPot=c.matriz.pot_modo==='valor'?(+c.matriz.pot_valor||0):med;
  const limPart=(+c.matriz.part_alta||50)/100;
  const tot=ps.reduce((s,p)=>s+(+p.compras_12m||0),0);
  const ord=[...ps].sort((a,b)=>(+b.compras_12m||0)-(+a.compras_12m||0));
  let acc=0;const info={};
  ord.forEach(p=>{const v=+p.compras_12m||0,antes=acc;acc+=v;const abc=!v||!tot?'C':antes/tot<0.8?'A':antes/tot<0.95?'B':'C';info[p.id]={abc,acum:tot?acc/tot:0}});
  ps.forEach(p=>{const pi=potInfo(p),part=pi.v?(+p.compras_12m||0)/pi.v:null;let g=null;
    if(pi.v>0&&part!=null){const a=pi.v>=limPot,b=part>=limPart;g=a&&b?'proteger':a?'conquistar':b?'fidelizar':'desenvolver'}
    Object.assign(info[p.id],{pot:pi,part,grupo:g})});
  return S._k={med,limPot,limPart,tot,info,ord};
}
const KI=p=>K().info[p.id]||{pot:{v:0},part:null,grupo:null,abc:'C'};
const freqDe=p=>+p.frequencia_dias||(KI(p).grupo?+CFG().matriz.freq[KI(p).grupo]||30:30);
const grpChip=g=>g?`<span class="chip grp g-${g}">${GRUPOS[g].nome}</span>`:'';

/* sinais de relacionamento */
function proxContato(p){return p.proximo_contato||(p.ultimo_contato?addDays(p.ultimo_contato,freqDe(p)):null)}
function anivEm(p){const m=/^(\d{1,2})\/(\d{1,2})/.exec(p.aniversario||'');if(!m)return null;const t=new Date();t.setHours(0,0,0,0);const d=new Date(t.getFullYear(),m[2]-1,+m[1]);if(d<t)d.setFullYear(t.getFullYear()+1);return Math.round((d-t)/864e5)}
function variacao(p){const a=+p.compras_12m||0,b=+p.compras_12m_ant;return b?(a-b)/b:null}
function sinais(p){
  const hoje=today(),prox=proxContato(p),chips=[];let prio=0;const freq=freqDe(p),ki=KI(p);
  const sem=p.ultimo_contato?diffDays(hoje,p.ultimo_contato):null;let atraso=false,semana=false;
  if(!prox){chips.push({t:'Sem contato registrado',c:'warn'});prio+=40;atraso=true}
  else{const d=diffDays(prox,hoje);
    if(d<0){chips.push({t:`Contato atrasado ${plural(-d,'dia')}`,c:'crit'});prio+=50+Math.min(-d,60);atraso=true}
    else if(d===0){chips.push({t:'Contato previsto para hoje',c:'warn'});prio+=45;atraso=true}
    else if(d<=7){chips.push({t:`Contato em ${plural(d,'dia')}`,c:'ok'});prio+=20-d;semana=true}}
  const an=anivEm(p);
  if(an!=null&&an<=7){chips.push({t:an===0?'Aniversário hoje':`Aniversário em ${plural(an,'dia')}`,c:'gift'});prio+=an===0?60:25}
  const v=variacao(p);const risco=(v!=null&&v<=-0.3)||(sem!=null&&sem>2*freq);
  if(v!=null&&v<=-0.3){chips.push({t:`Compras ${Math.round(v*100)}% em 12 meses`,c:'crit'});prio+=30}
  if(sem!=null&&sem>2*freq){chips.push({t:`${sem} dias sem contato`,c:'crit'});prio+=20}
  if(ki.grupo==='conquistar')prio+=15;if(ki.grupo==='proteger')prio+=10;
  prio+=Math.min(20,(ki.pot.v||0)/100000);
  return {prio,chips,prox,sem,an,v,atraso,semana,risco,freq};
}

/* recomendações: quantidade, embalagens e valor */
const stc=r=>r.status_comercial||'Em aberto';
function produtoDe(it){if(!it)return null;if(it.produtoId){const p=S.produtos.find(x=>x.id===it.produtoId);if(p)return p}const n=norm(it.produto);return n?S.produtos.find(x=>norm(x.nome)===n)||null:null}
function ctxRec(r){const p=S.prods.get(r.produtorId);const l=p&&r.lavouraId?lavouras(p).find(x=>x.id===r.lavouraId):null;
  const area=(r.area_ha!=null&&r.area_ha!=='')?+r.area_ha:(l?+l.area_ha||0:0);
  return {p,l,area,calda:+r.volume_calda||0,sem:+r.semente_kg_ha||0,plantas:l?plantasHa(l):0,mlin:l&&+l.esp_linha?10000/+l.esp_linha:0}}
function calcItem(it,ctx){
  const d=num(it.dose),out={prod:produtoDe(it)};
  if(d==null)return {...out,erro:'informe a dose'};if(!ctx.area)return {...out,erro:'informe a área'};
  const A=ctx.area;let tot,u;
  const need=(v,msg)=>{if(!v)throw msg};
  try{switch(it.unidade){
    case 'L/ha':tot=d*A;u='L';break;case 'mL/ha':tot=d*A/1000;u='L';break;
    case 'kg/ha':tot=d*A;u='kg';break;case 'g/ha':tot=d*A/1000;u='kg';break;case 't/ha':tot=d*A;u='t';break;case 'un/ha':tot=d*A;u='un';break;
    case '% v/v':need(ctx.calda,'informe a calda');tot=d/100*ctx.calda*A;u='L';break;
    case 'mL/100 L':need(ctx.calda,'informe a calda');tot=d/1000*ctx.calda/100*A;u='L';break;
    case 'L/100 L':need(ctx.calda,'informe a calda');tot=d*ctx.calda/100*A;u='L';break;
    case 'g/100 L':need(ctx.calda,'informe a calda');tot=d/1000*ctx.calda/100*A;u='kg';break;
    case 'mL/kg sem.':need(ctx.sem,'informe kg de semente/ha');tot=d/1000*ctx.sem*A;u='L';break;
    case 'g/kg sem.':need(ctx.sem,'informe kg de semente/ha');tot=d/1000*ctx.sem*A;u='kg';break;
    case 'kg/planta':need(ctx.plantas,'informe o espaçamento da lavoura');tot=d*ctx.plantas*A;u='kg';break;
    case 'g/planta':need(ctx.plantas,'informe o espaçamento da lavoura');tot=d/1000*ctx.plantas*A;u='kg';break;
    case 'g/m linear':need(ctx.mlin,'informe o espaçamento entre linhas');tot=d/1000*ctx.mlin*A;u='kg';break;
    default:return {...out,erro:'unidade sem cálculo'};
  }}catch(msg){return {...out,erro:msg}}
  const pr=out.prod;let emb=null,valor=null,obs=null;
  if(pr){const pu=pr.unidade||'L';let t2=null;
    if(u===pu)t2=tot;else if(u==='t'&&pu==='kg')t2=tot*1000;else if(u==='kg'&&pu==='t')t2=tot/1000;else obs=`produto vendido em ${pu}`;
    if(t2!=null){if(+pr.embalagem>0)emb={n:Math.ceil(t2/+pr.embalagem-1e-9),tam:+pr.embalagem,u:pu};
      if(+pr.preco>0)valor=(emb?emb.n*emb.tam:t2)*+pr.preco;}}
  return {...out,tot,u,emb,valor,obs};
}
function calcRec(r){const ctx=ctxRec(r);const itens=(r.itens||[]).filter(i=>i.produto).map(i=>({...i,...calcItem(i,ctx)}));
  const vs=itens.map(i=>i.valor).filter(v=>v!=null);return {ctx,itens,valor:vs.length?vs.reduce((a,b)=>a+b,0):null,completo:itens.length>0&&vs.length===itens.length}}
const fmtQ=(t,u)=>nfmt(t,t<10?2:1)+' '+u;

function parseHash(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h.startsWith('p-')){const i=h.indexOf('--');const id=i>0?h.slice(2,i):h.slice(2);let sub=i>0?h.slice(i+2):'geral',lid=null;if(sub.startsWith('lav-')){lid=sub.slice(4);sub='lavoura'}return {v:'produtor',id,sub,lid}}
  const r=ROUTES[h]||ROUTES.hoje;return {v:r[0],sub:r[1]||null};
}

function render(){

  $$('#tabs a,#gear,#bnav [data-v]').forEach(a=>{const on=a.dataset.v===r.v||(r.v==='produtor'&&a.dataset.v==='carteira')||(a.dataset.v==='mais'&&['comercial','produtos','safra','importar','ajustes'].includes(r.v));if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(!S.ready.p)return;

  const key=location.hash||'#hoje';

/* ---------- Rota e mapa ---------- */
const coordOk=p=>p.lat!=null&&p.lon!=null&&isFinite(+p.lat)&&isFinite(+p.lon)&&+p.lat!==0;
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function parseCoord(s){const m=String(s||'').match(/(-?\d{1,3}(?:[.,]\d+)?)\s*[,; ]\s*(-?\d{1,3}(?:[.,]\d+)?)/);if(!m)return null;const lat=+m[1].replace(',','.'),lon=+m[2].replace(',','.');if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)return null;return {lat,lon}}
function otimizar(start,pts,volta){
  if(!pts.length)return [];let rest=[...pts],cur=start,out=[];
  if(!cur){cur=rest.shift();out.push(cur)}
  while(rest.length){let bi=0,bd=1e18;rest.forEach((p,i)=>{const d=hav(cur,p);if(d<bd){bd=d;bi=i}});cur=rest.splice(bi,1)[0];out.push(cur)}
  const full=o=>[start,...o,...(volta&&start?[start]:[])].filter(Boolean);
  const len=a=>a.reduce((s,p,i)=>i?s+hav(a[i-1],p):0,0);
  let melhorou=true,guard=0;const off=start?0:1;
  while(melhorou&&guard++<50){melhorou=false;
    for(let i=off;i<out.length-1;i++)for(let k=i+1;k<out.length;k++){const nv=[...out.slice(0,i),...out.slice(i,k+1).reverse(),...out.slice(k+1)];if(len(full(nv))+1e-9<len(full(out))){out=nv;melhorou=true}}}
  return out;
}
function vRota(){
  const c=CFG(),R=S.rota,t=R.data;const ps=[...S.prods.values()];const com=ps.filter(coordOk),sem=ps.filter(p=>!coordOk(p));
  const ag=agendaItens().filter(i=>i.data===t&&i.pid);const agIds=new Set(ag.map(i=>i.pid));
  if(!R.sel||R.selData!==t){R.sel=new Set(com.filter(p=>agIds.has(p.id)).map(p=>p.id));R.selData=t}
  const base=c.base&&c.base.lat!=null&&isFinite(+c.base.lat)?{lat:+c.base.lat,lon:+c.base.lon,nome:c.base.nome||'Base',base:true}:null;
  const pts=com.filter(p=>R.sel.has(p.id)).map(p=>({lat:+p.lat,lon:+p.lon,nome:p.apelido||p.nome,p}));
  const ordem=otimizar(base,pts,R.volta);
  const seq=[...(base?[base]:[]),...ordem,...(base&&R.volta&&ordem.length?[base]:[])];
  const f=+c.fator_estrada||1.3,vel=+c.velocidade||50;
  let km=0;const legs=seq.map((p,i)=>{if(!i)return 0;const d=hav(seq[i-1],p)*f;km+=d;return d});
  const mins=Math.round(km/vel*60);
  const gm=(()=>{if(seq.length<2)return [];const links=[];const all=seq.map(p=>`${p.lat},${p.lon}`);
    for(let i=0;i<all.length-1;i+=10){const ch=all.slice(i,i+11);if(ch.length<2)break;const o=ch[0],d=ch[ch.length-1],w=ch.slice(1,-1);
      links.push(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(o)}&destination=${encodeURIComponent(d)}${w.length?'&waypoints='+encodeURIComponent(w.join('|')):''}&travelmode=driving`)}return links})();
  $('#view').innerHTML=`<div class="sec-h"><h1>${ic('pin',22)}Rota de visitas</h1></div>${agTabs('rota')}
   ${!com.length?'<div class="notice" style="margin-bottom:12px">Nenhum produtor tem localização. Abra a ficha, vá em Perfil e cole as coordenadas do Google Maps (toque e segure no mapa, copie os números).</div>':''}
   <div class="grid2">
    <div class="stack">
     <section class="card map">${mapaSVG(com,seq,base,ordem)}
      <p class="muted sm" style="margin-top:8px">Mapa esquemático: mostra a posição relativa das propriedades. Ruas e estradas aparecem ao abrir a rota no Google Maps.</p></section>
     ${ordem.length?`<section class="card route"><div class="sec-h"><h2>Ordem sugerida</h2><div class="row-btns">${gm.map((u,i)=>`<a class="btn leaf sm" href="${esc(u)}" target="_blank" rel="noopener">${ic('pin',14)}Abrir no Google Maps${gm.length>1?' (parte '+(i+1)+')':''}</a>`).join('')}</div></div>
      <div class="tiles" style="margin-bottom:10px">${tile(nfmt(km,0)+' km','distância estimada',{x:`linha reta × ${nfmt(f,2)}`})}${tile(Math.floor(mins/60)+'h'+pad(mins%60),'ao volante',{x:`média de ${vel} km/h, sem contar as visitas`})}${tile(ordem.length,'paradas')}</div>
      <ol>${base?`<li style="list-style:none;margin-left:-22px"><b>Saída:</b> ${esc(base.nome)}</li>`:''}${ordem.map((p,i)=>`<li><b><a href="#p-${esc(p.p.id)}">${esc(p.p.nome)}</a></b> <span class="muted sm">${esc(p.p.municipio||'')}${i||base?' · '+nfmt(legs[base?i+1:i],1)+' km do ponto anterior':''}</span><div class="chips">${grpChip(KI(p.p).grupo)}${ag.filter(a=>a.pid===p.p.id).map(a=>`<span class="chip"><span class="ico ${a.k}"></span>${esc(a.tit)}</span>`).join('')}</div></li>`).join('')}${base&&R.volta?`<li style="list-style:none;margin-left:-22px"><b>Retorno:</b> ${esc(base.nome)} · ${nfmt(legs[legs.length-1],1)} km</li>`:''}</ol></section>`:''}
    </div>
    <div class="stack">
     <section class="box"><div class="box-h"><h2>Quem visitar</h2><p>Os produtores com compromisso na data já vêm marcados.</p></div>
      <div class="box-b" style="display:flex;gap:8px;flex-wrap:wrap;align-items:end"><label class="fl" style="flex:1 1 140px">Data<input type="date" id="rt-data" value="${t}"></label><label class="check sm"><input type="checkbox" id="rt-volta" ${R.volta?'checked':''}> Voltar à base</label></div>

function mapaSVG(com,seq,base,ordem){
  const all=[...com.map(p=>({lat:+p.lat,lon:+p.lon})),...(base?[base]:[])];
  if(!all.length)return '<p class="muted">Sem pontos para mostrar.</p>';
  const W=640,H=420,P=50;
  let la0=Math.min(...all.map(p=>p.lat)),la1=Math.max(...all.map(p=>p.lat)),lo0=Math.min(...all.map(p=>p.lon)),lo1=Math.max(...all.map(p=>p.lon));
  if(la1-la0<0.02){la0-=0.01;la1+=0.01}if(lo1-lo0<0.02){lo0-=0.01;lo1+=0.01}
  const kx=Math.cos((la0+la1)/2*Math.PI/180);
  const sc=Math.min((W-2*P)/((lo1-lo0)*kx),(H-2*P)/(la1-la0));
  const ox=(W-(lo1-lo0)*kx*sc)/2,oy=(H-(la1-la0)*sc)/2;
  const X=p=>ox+(p.lon-lo0)*kx*sc,Y=p=>oy+(la1-p.lat)*sc;
  const pxKm=sc/111.32;const cand=[1,2,5,10,20,50,100,200];const bar=cand.find(k=>k*pxKm>=70)||200;
  const ordIdx=new Map(ordem.map((p,i)=>[p.p.id,i+1]));
  const corG={proteger:'var(--ok)',conquistar:'var(--accent)',fidelizar:'var(--leaf)',desenvolver:'var(--warn)'};
  const line=seq.length>1?`<polyline points="${seq.map(p=>X(p).toFixed(1)+','+Y(p).toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="6 4" stroke-linejoin="round"/>`:'';
  const dots=com.map(p=>{const q={lat:+p.lat,lon:+p.lon},n=ordIdx.get(p.id),g=KI(p).grupo,x=X(q),y=Y(q);
    return `<g><title>${esc(p.nome)}${g?' · '+GRUPOS[g].nome:''}</title><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${n?11:6}" fill="${corG[g]||'var(--muted)'}" stroke="var(--surface)" stroke-width="2" opacity="${n?1:.7}"/>${n?`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle" style="fill:var(--surface);stroke:none;font-weight:700">${n}</text>`:''}<text x="${(x+(n?14:9)).toFixed(1)}" y="${(y+4).toFixed(1)}">${esc(primeiro(p.apelido||p.nome))}</text></g>`}).join('');
  const b=base?`<g><title>${esc(base.nome)}</title><rect x="${(X(base)-8).toFixed(1)}" y="${(Y(base)-8).toFixed(1)}" width="16" height="16" rx="3" fill="var(--ink)"/><text x="${(X(base)+12).toFixed(1)}" y="${(Y(base)+4).toFixed(1)}" style="font-weight:700">${esc(base.nome)}</text></g>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa esquemático das propriedades">${line}${dots}${b}
   <g transform="translate(16,${H-18})"><line x1="0" y1="0" x2="${(bar*pxKm).toFixed(1)}" y2="0" stroke="var(--ink)" stroke-width="2"/><line x1="0" y1="-4" x2="0" y2="4" stroke="var(--ink)" stroke-width="2"/><line x1="${(bar*pxKm).toFixed(1)}" y1="-4" x2="${(bar*pxKm).toFixed(1)}" y2="4" stroke="var(--ink)" stroke-width="2"/><text x="0" y="-8">${bar} km</text></g>
   <text x="${W-16}" y="22" text-anchor="end">N ↑</text></svg>
   <div class="legend" style="margin-top:8px">${Object.entries(GRUPOS).map(([k,g])=>`<span><i style="background:${corG[k]}"></i>${g.nome}</span>`).join('')}<span><i style="background:var(--ink)"></i>Base</span></div>`;
}

function roteiro(p,hist){
  const nome=chamado(p),s=sinais(p),ki=KI(p),ab=[],con=[],of=[],at=[];
  if(s.an===0)ab.push(`Hoje é aniversário de ${nome}. Parabenize antes de qualquer assunto.`);
  else if(s.an!=null&&s.an<=7)ab.push(`Aniversário em ${plural(s.an,'dia')}, no dia ${p.aniversario}. Marque para parabenizar no dia.`);
  const ult=hist&&hist[0];if(ult&&ult.proximos_passos)ab.push(`Retome o combinado no último atendimento (${fmtBR(ult.data)}): "${ult.proximos_passos}".`);
  const pend=recsDe(p.id).filter(r=>r.status==='Recomendada');
  if(pend.length)ab.push(`Pergunte se aplicou: ${pend.slice(0,3).map(r=>r.titulo+' ('+cropNomeById(p,r.lavouraId)+')').join(', ')}.`);
  if(p.situacao)ab.push(`Pergunte como evoluiu: ${p.situacao}.`);
  if(s.sem!=null&&s.sem>s.freq)ab.push(`Faz ${s.sem} dias do último contato (o combinado é a cada ${s.freq}). Reconheça o intervalo e mostre que acompanhou a propriedade.`);
  if(!ab.length)ab.push(`Chame de ${nome} e pergunte da lavoura antes de falar de produto.`);
  if(p.interesses)con.push(`Assunto pessoal: ${p.interesses}.`);if(p.familia)con.push(`Família e sucessão: ${p.familia}.`);if(p.dores)con.push(`Mostre que lembra da preocupação: ${p.dores}.`);
  if(!con.length)con.push('Perfil pessoal ainda vazio. Nesta conversa, descubra uma coisa da família e um interesse fora da roça e registre no perfil.');
  lavouras(p).forEach(l=>{const f=faseAtual(l);if(!f||!f.fase)return;const e=estInfo(l);of.push(`${lavNome(l)}${l.area_ha?', '+nfmt(l.area_ha)+' ha':''}${e.dap!=null&&e.dap>=0?', '+e.dap+' DAP':''}, ${f.fase.toLowerCase()}: foco em ${String(f.foco||'').toLowerCase()}. Ofereça ${String(f.oferta||'').toLowerCase()}.`)});
  const ruins=(p.maquinas||[]).filter(m=>/ruim|parad/i.test(m.estado||''));
  if(ruins.length)of.push(`Máquinas em estado ruim ou paradas: ${ruins.map(m=>m.tipo+(m.marca_modelo?' '+m.marca_modelo:'')).join(', ')}. Pergunte se precisa de peças, revisão ou troca.`);
  if(ki.grupo)of.push(`Grupo ${GRUPOS[ki.grupo].nome}: ${GRUPOS[ki.grupo].acao} A cooperativa tem ${pct(ki.part)} de um potencial de ${brl(ki.pot.v)}.`);
  const e=ESTILOS[p.estilo];if(e){of.push(`Como apresentar para um perfil ${e.nome.toLowerCase()}: ${e.dica}`);at.push(`Evite: ${e.evitar}`)}
  else at.push('Estilo de decisão não informado. Observe se ele pede números, confiança, segurança, novidade ou preço, e registre.');
  if(s.v!=null&&s.v<=-0.3)at.push(`As compras caíram ${Math.abs(Math.round(s.v*100))}% em 12 meses (${brl(p.compras_12m_ant)} para ${brl(p.compras_12m)}). Descubra o motivo com pergunta aberta, sem cobrar: preço, atendimento ou concorrente.`);
  const perd=recsDe(p.id).filter(r=>stc(r)==='Comprou fora'&&r.motivo_perda);if(perd.length)at.push(`Já comprou fora por: ${[...new Set(perd.map(r=>r.motivo_perda.toLowerCase()))].join(', ')}. Prepare-se para essa objeção.`);
  const canal=[p.canal,p.melhor_horario].filter(Boolean).join(', ')||'Canal não informado';
  const c1=lavouras(p).map(l=>({l,f:faseAtual(l)})).find(x=>x.f&&x.f.fase&&!x.f.pre);
  let wpp=`${saudacao()}, ${nome}! Tudo bem por aí?`;if(s.an===0)wpp+=' Feliz aniversário! Muita saúde e uma ótima safra.';
  if(c1)wpp+=` Como está o ${cropNome(c1.l).toLowerCase()} nessa fase de ${c1.f.fase.toLowerCase()}?`;
  wpp+=' Queria passar aí esta semana para conversarmos. Qual dia fica melhor para você?';
  return {ab,con,of,at,canal,wpp};
}

async function salvarPerfil(id){

async function shrink(file,max=1600){try{const bmp=await createImageBitmap(file);const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82))}catch(e){return file}}

    const lavs=lavouras(p).map(l=>{const o=obs.find(x=>x.lavouraId===l.id);const c={...l};delete c._derivada;if(o){if(o.estadio){c.estadio_obs=o.estadio;c.estadio_data=data}if(o.condicao)c.condicao=o.condicao;if(o.manejo)c.manejo=o.manejo}return c});

    S.relFotos.forEach(f=>URL.revokeObjectURL(f.url));S.relFotos=[];

  }catch(e){btn.disabled=false;btn.textContent=lbl;toast(e&&e.code==='quota_exceeded'?'A base atingiu o limite de registros.':'Não foi possível salvar o relatório. Tente de novo.')}
}

function cabecalho(){const c=CFG();return [c.cooperativa,c.consultor?('Consultor: '+c.consultor+(c.crea?' · CREA '+c.crea:'')):null,c.telefone?('Contato: '+c.telefone):null].filter(Boolean)}
function recModelo(p,r,valores){
  const cr=calcRec(r);const l=cr.ctx.l;const its=[];
  its.push({h:`${r.titulo||r.tipo} · ${l?lavNome(l):'Geral'}${cr.ctx.area?' ('+nfmt(cr.ctx.area)+' ha)':''}`});
  const info=[r.alvo?'Alvo: '+r.alvo:null,r.volume_calda?'Calda: '+nfmt(r.volume_calda)+' L/ha':null,r.data_prevista?'Aplicar a partir de '+fmtBR(r.data_prevista):null].filter(Boolean);if(info.length)its.push({p:info.join(' · ')});
  cr.itens.forEach((i,n)=>its.push({li:`${n+1}. ${i.produto}: ${i.dose||''} ${i.unidade||''}${i.tot!=null?` · total ${fmtQ(i.tot,i.u)}`:''}${i.emb?` (${embTxt(i.emb)})`:''}${valores&&i.valor!=null?` · ${brl(i.valor)}`:''}`}));
  if(valores&&cr.valor!=null)its.push({p:`Total estimado: ${brl(cr.valor)}${cr.completo?'':' (alguns itens sem preço)'}`});
  if(r.obs)its.push({p:'Obs.: '+r.obs});
  return its;
}
function modeloRelatorio(a,o={}){
  const p=S.prods.get(a.produtorId);const recs=S.recs.filter(r=>r.atendimentoId===a.id);
  const secoes=[];
  if((a.lavouras||[]).length)secoes.push({titulo:'Lavouras vistoriadas',itens:a.lavouras.map(x=>{const l=lavouras(p).find(z=>z.id===x.lavouraId);const e=l?estInfo(l):null;
    return {li:`${l?lavNome(l):'Lavoura'}${l&&l.area_ha?' ('+nfmt(l.area_ha)+' ha)':''}${e&&e.tipo==='anual'&&l.plantio?' · '+diffDays(a.data,l.plantio)+' dias após o plantio':''}: ${[x.estadio,x.condicao?'condição '+x.condicao.toLowerCase():null,x.manejo&&x.manejo!=='Em produção'?x.manejo.toLowerCase():null,x.pragas?'pragas: '+x.pragas:null,x.doencas?'doenças: '+x.doencas:null,x.daninhas?'daninhas: '+x.daninhas:null,x.nutricao?'nutrição: '+x.nutricao:null,x.obs].filter(Boolean).join('; ')||'vistoriada, sem ocorrências'}`}})});
  if(recs.length)secoes.push({titulo:o.valores?'Recomendações e orçamento':'Recomendações',itens:recs.flatMap(r=>recModelo(p,r,o.valores))});
  const fech=[];if(a.resumo&&o.resumo)fech.push({p:a.resumo});if(a.proximos_passos)fech.push({kv:['Próximo passo',a.proximos_passos]});if(a.proximo_contato)fech.push({kv:['Próxima visita',fmtBR(a.proximo_contato)]});
  if(fech.length)secoes.push({titulo:'Combinados',itens:fech});
  return {titulo:'Relatório de visita técnica',data:fmtBR(a.data),cab:cabecalho(),produtor:[`Produtor: ${p.nome}`,[p.propriedade,p.municipio].filter(Boolean).join(' · ')].filter(Boolean),secoes,fotos:(a.fotos||[]).filter(f=>f.id),rodape:'Este relatório não substitui o receituário agronômico.'};
}
function modeloOrcamento(r){const p=S.prods.get(r.produtorId);return {titulo:'Orçamento',data:fmtBR(today()),cab:cabecalho(),produtor:[`Produtor: ${p.nome}`,[p.propriedade,p.municipio].filter(Boolean).join(' · ')].filter(Boolean),secoes:[{titulo:'Itens',itens:recModelo(p,r,true)}],fotos:[],rodape:'Valores estimados, sujeitos a confirmação no fechamento do pedido.'}}
function toWhats(m){const L=[`*${m.titulo}* · ${m.data}`,...m.produtor,...m.cab,''];m.secoes.forEach(s=>{L.push(`*${s.titulo.toUpperCase()}*`);s.itens.forEach(i=>{if(i.h)L.push('*'+i.h+'*');else if(i.li)L.push('• '+i.li);else if(i.kv)L.push(`*${i.kv[0]}:* ${i.kv[1]}`);else if(i.p)L.push(i.p)});L.push('')});L.push('_'+m.rodape+'_');return L.join('\n')}
async function fotoData(id){const r=await fetch(BLOB+id);if(!r.ok)throw 0;const b=await r.blob();const bmp=await createImageBitmap(b);const s=Math.min(1,1100/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return {d:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height}}
async function gerarPDF(m,fname,comFotos){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('O gerador de PDF ainda não carregou. Verifique a conexão e tente de novo.');return}
  const doc=new J({unit:'mm',format:'a4'});const W=210,H=297,Mg=16;let y=0;
  const ensure=h=>{if(y+h>H-18){doc.addPage();y=Mg}};
  doc.setFillColor(59,122,54);doc.rect(0,0,W,26,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(m.titulo,Mg,12);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);if(m.cab.length)doc.text(m.cab.join('   '),Mg,19.5,{maxWidth:W-2*Mg});doc.setFontSize(11);doc.text(m.data,W-Mg,12,{align:'right'});
  y=35;
  const para=(t,{size=10,bold=false,indent=0,color=[22,33,28],gap=1.4}={})=>{doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);doc.setTextColor(...color);const lines=doc.splitTextToSize(String(t),W-2*Mg-indent);const lh=size*0.43;lines.forEach(ln=>{ensure(lh+1);doc.text(ln,Mg+indent,y);y+=lh});y+=gap};
  m.produtor.forEach((t,i)=>para(t,{size:i?10:12,bold:!i,gap:.8}));y+=2;
  m.secoes.forEach(s=>{ensure(16);y+=2;doc.setDrawColor(213,221,214);doc.line(Mg,y,W-Mg,y);y+=6;para(s.titulo.toUpperCase(),{size:9,bold:true,color:[86,101,94],gap:2});
    s.itens.forEach(i=>{if(i.h){y+=1;para(i.h,{size:11,bold:true,gap:1})}else if(i.li){ensure(6);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(22,33,28);doc.text('-',Mg+1.5,y);para(i.li,{indent:5,gap:.9})}else if(i.kv)para(i.kv[0]+': '+i.kv[1],{gap:.9});else if(i.p)para(i.p,{gap:1.2})})});
  if(comFotos&&m.fotos.length){ensure(20);y+=2;doc.setDrawColor(213,221,214);doc.line(Mg,y,W-Mg,y);y+=6;para('FOTOS',{size:9,bold:true,color:[86,101,94],gap:2});
    const cw=(W-2*Mg-6)/2;let col=0,rowH=0;
    for(const f of m.fotos){let im;try{im=await fotoData(f.id)}catch(e){continue}
      const h=Math.min(68,cw*im.h/im.w),w=h*im.w/im.h;if(col===0)ensure(h+10);const x=Mg+col*(cw+6);
      doc.addImage(im.d,'JPEG',x,y,w,h);if(f.legenda){doc.setFontSize(8.5);doc.setTextColor(86,101,94);doc.text(doc.splitTextToSize(f.legenda,cw)[0],x,y+h+4)}
      rowH=Math.max(rowH,h+8);col++;if(col===2){col=0;y+=rowH;rowH=0}}
    if(col)y+=rowH}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,130,125);doc.text(m.rodape,Mg,H-9);doc.text(`Página ${i} de ${n}`,W-Mg,H-9,{align:'right'})}
  await baixar(fname,doc.output('blob'));
}

  V.chunks=[];V.cancel=false;V.ctx=ctx;

async function vozEnviar(blob,ctx,dur){

async function vozProcessarFila(){
  if(S.vozBusy||!vozOn()||navigator.onLine===false)return;const fila=S.vozFila.filter(i=>i.status==='pendente');if(!fila.length)return;

    try{const r=await withTO(S.voz.processar(blob,vozMeta(it.alvo,it.pid)),90000);it.status='pronto';it.texto=r.texto||'';it.dados=r.dados||{};await IDB.del('vozblob:'+it.id);toast('Áudio processado: pronto para revisar em Hoje.')}
    catch(e){if(vozTransitorio(e))break;it.status='erro';it.erro=vozErro(e)}
    await vozSalvarFila();sched()}}
  finally{S.vozBusy=false;await vozSalvarFila();sched()}
}

async function carregarExemplos(){
  const {PR,Pd,At,R,L}=dadosExemplo();const now=new Date().toISOString();
  try{for(const x of PR){const {id,...r}=x;await LDB.doc('produtos/'+id).set(clean({...r,ativo:true,exemplo:true,criadoEm:now}))}
    for(const p of Pd){const {id,...r}=p;await LDB.doc('produtores/'+id).set({...r,culturas:[...new Set(r.lavouras.map(l=>l.cultura))],exemplo:true,updatedAt:now})}
    for(const a of At){const {id,...r}=a;await LDB.doc('atendimentos/'+id).set({...r,exemplo:true,criadoEm:now})}
    for(const x of R){const {id,...r}=x;await LDB.doc('recomendacoes/'+id).set({...r,exemplo:true,criadoEm:now})}
    for(const x of L){const {id,...r}=x;await LDB.doc('lembretes/'+id).set({...r,exemplo:true,criadoEm:now})}
    toast('Exemplos carregados')}catch(e){toast('Não foi possível carregar os exemplos.')}
}
async function removerExemplos(){
  try{for(const p of [...S.prods.values()].filter(p=>p.exemplo))await LDB.doc('produtores/'+p.id).delete();
    for(const c of ['atendimentos','recomendacoes','lembretes','produtos']){const sn=await LDB.collection(c).where('exemplo','==',true).get();for(const d of sn.docs)await LDB.doc(c+'/'+d.id).delete()}
    toast('Exemplos removidos')}catch(e){toast('Não foi possível remover os exemplos.')}
}

  const ref=S.db.doc(o.col+'/'+o.id);

  if(o.op==='update'){try{return await ref.update(o.data)}catch(e){if(e&&e.code==='invalid_argument'&&!(S.base[o.col]||new Map()).has(o.id))return;throw e}}

     <li>Quando o sinal voltar, o app envia sozinho, na ordem em que você registrou.</li>
     <li>Se o app fechar sem sinal, nada se perde: as alterações ficam no aparelho e são enviadas na próxima vez que você abrir com internet.</li></ol>
    <p class="muted" style="margin-top:8px">Sem internet não funcionam: abrir o app do zero (ele roda dentro do Claude), a abordagem com IA, a rota no Google Maps e as fotos de visitas antigas que nunca foram abertas neste aparelho.</p>
    <p class="muted" style="margin-top:6px">Se usar celular e notebook ao mesmo tempo sem sinal, mexa no mesmo produtor em um aparelho só: na sincronização vale a última alteração enviada.</p></div>
   <div class="acts"><button type="button" class="btn pri" data-act="sync-now" ${!S.db||!n?'disabled':''}>Enviar agora</button></div>`,null);
}
addEventListener('online',()=>{S.sync.err=false;netBar();flush();setTimeout(()=>vozProcessarFila(),1500)});
setInterval(()=>{if(S.vozFila.some(i=>i.status==='pendente'))vozProcessarFila()},30000);
addEventListener('offline',()=>netBar());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.outbox.length)flush()});
setInterval(()=>{if(S.outbox.length)flush()},20000);
const statusBar=()=>{const st=$('#status');const ex=[...S.prods.values()].some(p=>p.exemplo);st.hidden=!ex;st.style.marginBottom='16px';st.innerHTML=ex?'Há dados de exemplo na base (produtores, produtos e vendas). <button class="btn sm w" data-act="rm-ex">Remover exemplos</button>':''};

/* ================= conexão com o banco ================= */
(async()=>{
  const st=$('#status');S.route=parseHash();
  try{const vf=await IDB.get('vozfila');if(Array.isArray(vf))S.vozFila=vf}catch(e){}
  try{const [ob,saved,...bases]=await Promise.all([IDB.get('outbox'),IDB.get('savedAt'),...COLS.map(c=>IDB.get('base:'+c))]);
    S.outbox=Array.isArray(ob)?ob:[];S.sync.savedAt=saved||null;
    COLS.forEach((c,i)=>{if(Array.isArray(bases[i]))S.base[c]=new Map(bases[i])});
    if(S.base.produtores||S.outbox.length){COLS.forEach(rebuild);derive();S.ready.p=true;statusBar();render()}
  }catch(e){}
  netBar();
  const C=window.claude;
  if(!C||!C.use){if(!S.ready.p)st.textContent='Abra esta página pelo Claude para acessar a base de produtores.';netBar();return}
  const [db,sample,dl,user,assets]=await Promise.all([C.use('db'),C.use('sample'),C.use('downloads'),C.use('user'),C.use('assets')]);
  S.db=db;S.sample=sample;S.dl=dl;S.assets=assets;S.voz=window.__VOZ||null;
  if(!db){if(!S.ready.p)st.textContent='A base de produtores não está disponível nesta visualização. Entre na sua conta do Claude para acessar.';netBar();return}
  if(user){try{if(await user.can('data.write')===false)document.body.classList.add('ro')}catch(e){}}
  const timer=setTimeout(()=>{if(!S.ready.p)st.textContent='A base está demorando para responder. Se estiver sem sinal, ela carrega quando a conexão voltar.';netBar()},10000);
  COLS.forEach(col=>db.collection(col).onSnapshot(sn=>{
    S.base[col]=new Map(sn.docs.map(d=>[d.id,{...d.data(),id:d.id}]));
    if(!sn.metadata.fromCache){S.sync.live=true;S.sync.at=S.sync.at||Date.now();if(col==='produtores')clearTimeout(timer)}
    cacheSave(col);rebuild(col);derive();
    if(col==='produtores'){S.ready.p=true;statusBar()}
    sched();
  },()=>{if(col==='produtores'){clearTimeout(timer);if(!S.ready.p)st.textContent='Não foi possível ler a base de produtores agora.'}}));
  flush();
})();
})();
</script>
